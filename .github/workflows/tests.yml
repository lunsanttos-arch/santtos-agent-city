name: Testes Agent City
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          for f in server.js world.js github.js civic.js security.js; do node --check "$f"; done
          for f in public/*.js; do node --input-type=module --check < "$f"; done
      - name: Executar testes
        run: npm test
